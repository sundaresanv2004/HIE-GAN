batch_size: 64
num_workers: 4

epochs: 20

optimizer:
  type: "adam"
  lr: 1e-4
  weight_decay: 0.0

scheduler:
  use_scheduler: false
  step_size: 20
  gamma: 0.1

loss:
  chamfer_weight: 1.0

logging:
  log_dir: "output/logs"
  log_filename: "phase1_train.log"
  csv_filename: "phase1_train.csv"
  log_every_n_steps: 10

checkpoints:
  dir: "output/checkpoints"
  filename: "phase1_explicit.pt"
  resume: true
